[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netpolicy"
version = "0.1.0"
description = "CLI network policy auditor to detect silent blocking, interception, and tampering"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "netpolicy contributors" }
]
keywords = ["networking", "firewall", "audit", "dns", "middlebox", "probe", "scapy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "scapy>=2.5.0",
    "dnspython[doh]>=2.6.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/netpolicy/netpolicy"
Repository = "https://github.com/netpolicy/netpolicy.git"
Issues = "https://github.com/netpolicy/netpolicy/issues"
Documentation = "https://github.com/netpolicy/netpolicy#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
]
lab = [
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
netpolicy = "netpolicy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["netpolicy", "canary", "lab"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "scapy", "scapy.*", "dns", "dns.*"]
ignore_missing_imports = true
